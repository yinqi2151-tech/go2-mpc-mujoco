name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Windows 上 Python 默认用 cp1252 输出，打印中文会报 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 共享 CI 机器的计时波动较大：耗时上限放宽到 40 ms；加速比断言（≥2 倍）不受影响
      MPC_P95_LIMIT_MS: "40"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Unit tests
        run: pytest -m "not sim and not perf" --junitxml=test-reports/junit-unit.xml

      - name: Performance tests
        run: pytest -m perf -s --junitxml=test-reports/junit-perf.xml

      - name: Regression tests (MuJoCo closed loop)
        run: pytest -m sim --junitxml=test-reports/junit-sim.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: test-reports/
